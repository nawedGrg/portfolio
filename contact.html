        <main id="main-content">
            <div class="contact-page">
                <h1 class="section-title">Contact</h1>
                <p class="projects-subtitle">For work, collaboration, or questions.</p>

                <div class="contact-container">
                    <div class="contact-info">
                        <p><strong>Email</strong> <a href="mailto:Dewangurung34g@icloud.com">Dewangurung34g@icloud.com</a></p>
                        <p><strong>Phone</strong> <a href="tel:+818090035855">+81 80-9003-5855</a></p>
                        <p><strong>Location</strong> Tokyo, Japan</p>

                        <div class="socials">
                            <p>Elsewhere</p>
                            <ul>
                                <li>
                                    <a href="https://github.com/nawedGrg" target="_blank" rel="noopener noreferrer">
                                        <img src="images/social.png" alt="GitHub">
                                    </a>
                                </li>
                                <li>
                                    <a href="https://x.com/dewangurung_" target="_blank" rel="noopener noreferrer">
                                        <img src="images/twitter.png" alt="X">
                                    </a>
                                </li>
                                <li>
                                    <a href="https://www.instagram.com/dewan_gurungg/" target="_blank" rel="noopener noreferrer">
                                        <img src="images/social (1).png" alt="Instagram">
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <form id="contact-form" action="https://formspree.io/f/xpwrzpvw" method="POST">
                        <input type="text" name="_gotcha" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" autocomplete="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>

                        <button type="submit" id="submit-btn" class="button-primary">Send message</button>
                        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </main>
