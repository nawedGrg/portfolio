                    <div class="contact-info">
                        <p>For any inquiries ?</p>
                        <p><strong>Email :</strong> <a href="mailto:Dewangurung34g@icloud.com">Dewangurung34g@icloud.com</a></p>

                    <form id="contact-form" action="https://formspree.io/f/xpwrzpvw" method="POST">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>

                        <button type="submit" id="submit-btn">Send Message</button>
                        <p id="form-status" class="hidden"></p>
                    </form>
                </div>
